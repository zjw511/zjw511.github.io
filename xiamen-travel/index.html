<style>
:root{--flight:#667eea;--train:#4facfe;--ship:#43e97b;--food:#fa709a;--visit:#a23ec8;--hotel:#ffa502;--alert:#ff4757;--transport:#26d0ce;--bg:#f0f2f5;--card:#fff;--ink:#1a1a2e;--muted:#999;--line:#eee}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{overflow-x:hidden}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans CJK SC','PingFang SC',sans-serif;background:var(--bg);color:var(--ink);line-height:1.5;padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom)}
/* === Dynamic Island === */
.island{position:fixed;top:max(12px,env(safe-area-inset-top));left:50%;transform:translateX(-50%);z-index:9999;width:300px;background:#1a1a2e;border-radius:28px;transition:all .5s cubic-bezier(.4,0,.2,1);overflow:hidden;box-shadow:0 4px 20px rgba(0,0,0,.3);cursor:pointer}
.island.expanded{width:340px;border-radius:24px}
.island-compact{display:flex;align-items:center;padding:10px 16px;gap:8px}
.island-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;animation:pulse 2s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.5;transform:scale(1.3)}}
.island-text{flex:1;min-width:0}
.island-name{font-size:12px;font-weight:600;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.island-count{font-size:10px;color:#888;margin-top:1px}
.island-icon{font-size:16px;flex-shrink:0}
.island-expand{max-height:0;overflow:hidden;transition:max-height .4s ease;padding:0 16px}
.island.expanded .island-expand{max-height:320px;padding:0 16px 14px}
.island-detail{color:#ccc;font-size:12px;line-height:1.6}
.island-detail strong{color:#fff}
.island-actions{display:flex;gap:8px;margin-top:10px}
.island-btn{flex:1;background:rgba(255,255,255,.12);border:none;border-radius:8px;padding:8px;font-size:11px;color:#fff;font-weight:600;text-align:center;cursor:pointer}
.island-btn:active{background:rgba(255,255,255,.25)}
/* === Header === */
.app-header{background:linear-gradient(135deg,#667eea,#764ba2);color:#fff;padding:56px 16px 16px;text-align:center}
.app-header h1{font-size:18px;font-weight:700}
.app-header p{font-size:12px;opacity:.8;margin-top:2px}
/* === Day Tabs === */
.day-tabs{position:sticky;top:0;z-index:100;display:flex;background:#fff;box-shadow:0 1px 4px rgba(0,0,0,.06);padding:6px 8px;gap:4px}
.day-tab{flex:1;padding:10px 4px;text-align:center;border-radius:10px;font-size:12px;font-weight:600;color:var(--muted);cursor:pointer;transition:all .2s;border:none;background:transparent}
.day-tab.active{color:#fff}
.day-tab[data-day="0"].active{background:#ff4757}
.day-tab[data-day="1"].active{background:linear-gradient(135deg,#4facfe,#00f2fe)}
.day-tab[data-day="2"].active{background:linear-gradient(135deg,#667eea,#764ba2)}
.day-tab[data-day="3"].active{background:linear-gradient(135deg,#f093fb,#f5576c)}
.day-tab[data-day="4"].active{background:linear-gradient(135deg,#fa709a,#fee140)}
.day-tab .badge{display:block;font-size:10px;font-weight:400;opacity:.7;margin-top:2px}
/* === Timeline === */
.timeline{max-width:680px;margin:0 auto;padding:12px 12px 80px}
.event-card{background:#fff;border-radius:14px;margin-bottom:6px;overflow:hidden;box-shadow:0 1px 3px rgba(0,0,0,.05);border-left:4px solid var(--muted)}
.event-card.flight{border-color:var(--flight)}.event-card.train{border-color:var(--train)}.event-card.ship{border-color:var(--ship)}.event-card.food{border-color:var(--food)}.event-card.visit{border-color:var(--visit)}.event-card.hotel{border-color:var(--hotel)}.event-card.alert{border-color:var(--alert)}.event-card.transport{border-color:var(--transport)}
.ec-main{display:flex;gap:0}
.ec-time{width:64px;flex-shrink:0;padding:12px 6px;text-align:center;border-right:1px solid var(--line)}
.ec-time .t{font-size:15px;font-weight:800;font-variant-numeric:tabular-nums}
.ec-time .d{font-size:9px;color:var(--muted);margin-top:2px}
.ec-body{flex:1;padding:10px 12px;min-width:0}
.ec-name{font-size:13px;font-weight:600;display:flex;align-items:center;gap:4px;flex-wrap:wrap}
.ec-addr{font-size:11px;color:var(--muted);margin-top:3px;line-height:1.4}
.ec-desc{font-size:11px;color:#aaa;margin-top:3px;line-height:1.4}
.ec-travel{font-size:11px;color:#26d0ce;margin-top:3px;line-height:1.4;background:#f0fffe;padding:3px 8px;border-radius:6px;display:inline-block}
.ec-tags{display:flex;gap:4px;margin-top:5px;flex-wrap:wrap}
.tag{font-size:9px;padding:1px 6px;border-radius:99px;font-weight:600;white-space:nowrap}
.tag-free{background:#e8f5e9;color:#2e7d32}.tag-pay{background:#fff3e0;color:#e65100}.tag-booked{background:#e3f2fd;color:#1565c0}.tag-alert{background:#ffebee;color:#c62828}.tag-food{background:#fce4ec;color:#c62828}
.ec-actions{display:flex;gap:6px;padding:0 12px 10px;flex-wrap:wrap}
.ec-btn{font-size:11px;padding:6px 10px;border-radius:8px;border:none;font-weight:600;cursor:pointer;display:flex;align-items:center;gap:3px;white-space:nowrap}
.ec-btn:active{transform:scale(.95)}
.ec-btn-umetrip{background:#e8eaf6;color:#3f51b5}
.ec-btn-12306{background:#e3f2fd;color:#1565c0}
.ec-btn-walk{background:#e8f5e9;color:#2e7d32}
.ec-btn-taxi{background:#fff3e0;color:#e65100}
.ec-btn-ticket{background:#f3e5f5;color:#7b1fa2}
/* === Nav between stops === */
.nav-next{display:flex;align-items:center;gap:6px;padding:8px 12px;margin:0 auto 6px;max-width:680px;background:#f8f9fa;border-radius:10px;font-size:11px}
.nav-next .arrow{color:var(--muted);font-size:14px}
.nav-next .next-name{flex:1;color:#555;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nav-next .nav-btn{font-size:10px;padding:4px 8px;border-radius:6px;border:none;cursor:pointer;font-weight:600}
.nav-next .nav-btn:active{transform:scale(.95)}
.nav-btn-walk{background:#e8f5e9;color:#2e7d32}
.nav-btn-taxi{background:#fff3e0;color:#e65100}
/* === Nav Modal === */
.nav-modal{position:fixed;bottom:0;left:0;right:0;background:#fff;border-radius:20px 20px 0 0;padding:20px 16px 32px;z-index:9998;transform:translateY(100%);transition:transform .3s ease;box-shadow:0 -4px 20px rgba(0,0,0,.15)}
.nav-modal.show{transform:translateY(0)}
.nav-modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:9997;opacity:0;pointer-events:none;transition:opacity .3s}
.nav-modal-overlay.show{opacity:1;pointer-events:auto}
.nav-modal h3{font-size:16px;font-weight:700;margin-bottom:4px;text-align:center}
.nav-modal .route{font-size:12px;color:var(--muted);text-align:center;margin-bottom:16px}
.nav-modal .route strong{color:var(--ink)}
.nav-options{display:flex;gap:10px}
.nav-option{flex:1;border-radius:14px;padding:16px;text-align:center;cursor:pointer;border:2px solid transparent;transition:all .2s}
.nav-option:active{transform:scale(.97)}
.nav-option.walk{background:linear-gradient(135deg,#e8f5e9,#c8e6c9);border-color:#81c784}
.nav-option.taxi{background:linear-gradient(135deg,#fff3e0,#ffe0b2);border-color:#ffb74d}
.nav-option .icon{font-size:28px;margin-bottom:6px}
.nav-option .label{font-size:14px;font-weight:700}
.nav-option .sub{font-size:10px;color:#888;margin-top:2px}
.nav-close{position:absolute;top:12px;right:16px;font-size:18px;color:var(--muted);cursor:pointer;background:none;border:none}
/* === Install banner === */
.install-banner{position:fixed;bottom:0;left:0;right:0;background:#1a1a2e;color:#fff;padding:14px 16px;display:none;align-items:center;gap:10px;z-index:9000;box-shadow:0 -2px 12px rgba(0,0,0,.2)}

.install-banner .ic{font-size:24px}
.install-banner .txt{flex:1;font-size:13px}
.install-banner .btn{background:#667eea;border:none;border-radius:8px;padding:8px 16px;color:#fff;font-size:12px;font-weight:700;cursor:pointer}
.install-banner .btn:active{transform:scale(.95)}
.install-banner .close{background:none;border:none;color:#888;font-size:16px;cursor:pointer;padding:4px}
.bottom-spacer{height:60px}
@media(max-width:380px){.island{width:280px}.island.expanded{width:320px}}
</style>
</head>

var TC={flight:{icon:'✈️',color:'#667eea'},train:{icon:'🚄',color:'#4facfe'},ship:{icon:'🚢',color:'#43e97b'},food:{icon:'🍜',color:'#fa709a'},visit:{icon:'📍',color:'#a23ec8'},hotel:{icon:'🏨',color:'#ffa502'},alert:{icon:'⏰',color:'#ff4757'},transport:{icon:'🚕',color:'#26d0ce'}};
var currentDay=0,navTarget=null,islandExpanded=false,islandTimer=null;

function switchDay(d){currentDay=d;document.querySelectorAll('.day-tab').forEach(function(t){t.classList.toggle('active',parseInt(t.dataset.day)===d)});renderTimeline(d)}
function esc(s){return s.replace(/'/g,'\\\'')}
function renderTimeline(d){var ev=E.filter(function(e){return e.day===d});var html='';ev.forEach(function(e,i){html+=renderCard(e);var nxt=null;for(var j=i+1;j<ev.length;j++){if(ev[j].lng&&ev[j].lat){nxt=ev[j];break}}if(nxt&&e.lng&&e.lat){html+='<div class="nav-next"><span class="arrow">↓</span><span class="next-name">下一站：'+nxt.loc+'</span><button class="nav-btn nav-btn-walk" onclick="openNavModal('+e.lng+','+e.lat+',\''+esc(e.loc)+'\','+nxt.lng+','+nxt.lat+',\''+esc(nxt.loc)+'\')">🚶步行</button><button class="nav-btn nav-btn-taxi" onclick="openNavModal('+e.lng+','+e.lat+',\''+esc(e.loc)+'\','+nxt.lng+','+nxt.lat+',\''+esc(nxt.loc)+'\')">🚕打车</button></div>'}});document.getElementById('timeline').innerHTML=html}

function renderCard(e){
  var c=TC[e.type]||TC.visit;
  var html='<div class="event-card '+e.type+'"><div class="ec-main"><div class="ec-time"><div class="t" style="color:'+c.color+'">'+e.time+'</div><div class="d">'+(e.duration||'')+'</div></div><div class="ec-body"><div class="ec-name">'+c.icon+' '+e.name+'</div>';
  if(e.addr)html+='<div class="ec-addr">📍 '+e.addr+'</div>';
  if(e.desc)html+='<div class="ec-desc">'+e.desc+'</div>';
  if(e.travel)html+='<div class="ec-travel">'+e.travel+'</div>';
  if(e.tags){html+='<div class="ec-tags">';e.tags.forEach(function(t){var cls='tag-pay';if(t.indexOf('免费')>=0)cls='tag-free';if(t.indexOf('已订')>=0||t.indexOf('已购')>=0)cls='tag-booked';if(t.indexOf('必')>=0)cls='tag-alert';if(t.indexOf('美食')>=0||t.indexOf('小吃')>=0)cls='tag-food';html+='<span class="tag '+cls+'">'+t+'</span>'});html+='</div>'}
  html+='</div></div>';
  var btns='';
  if(e.type==='flight'&&e.flightNo){btns+='<button class="ec-btn ec-btn-umetrip" onclick="openUmetrip()">📲 航旅纵横</button>';btns+='<button class="ec-btn ec-btn-12306" onclick="openXiamenAir()">✈️ 厦航值机</button>'}
  if(e.type==='train'&&e.trainNo){btns+='<button class="ec-btn ec-btn-12306" onclick="open12306()">🚄 12306查车次</button>'}
  if(e.type==='ship'&&e.shipNo){btns+='<button class="ec-btn ec-btn-ticket" onclick="openShipTicket()">🎫 船票信息</button>'}
  if(e.lng&&e.lat){btns+='<button class="ec-btn ec-btn-walk" onclick="navigateToHere('+e.lng+','+e.lat+',\''+esc(e.loc)+'\',\'walk\')">🚶 步行到这</button>';btns+='<button class="ec-btn ec-btn-taxi" onclick="navigateToHere('+e.lng+','+e.lat+',\''+esc(e.loc)+'\',\'car\')">🚕 打车到这</button>'}
  if(btns)html+='<div class="ec-actions">'+btns+'</div>';
  html+='</div>';return html
}

// Dynamic Island
function getNextEvent(){var now=new Date();var up=E.filter(function(e){var d=e.date.split('-');var t=e.time.split(':');return new Date(d[0],d[1]-1,d[2],t[0],t[1])>now});if(up.length===0)return null;up.sort(function(a,b){var da=a.date.split('-'),ta=a.time.split(':'),db=b.date.split('-'),tb=b.time.split(':');return new Date(da[0],da[1]-1,da[2],ta[0],ta[1])-new Date(db[0],db[1]-1,db[2],tb[0],tb[1])});return up[0]}
function getCountdown(e){var now=new Date();var d=e.date.split('-');var t=e.time.split(':');var et=new Date(d[0],d[1]-1,d[2],t[0],t[1]);var diff=et-now;if(diff<0)return '进行中';var days=Math.floor(diff/86400000);var hours=Math.floor(diff%86400000/3600000);var mins=Math.floor(diff%3600000/60000);if(days>0)return days+'天'+hours+'小时后';if(hours>0)return hours+'小时'+mins+'分钟后';if(mins>0)return mins+'分钟后';return '即将开始！'}
function updateIsland(){var e=getNextEvent();if(!e){document.getElementById('islandName').textContent='行程已结束';document.getElementById('islandCount').textContent='🎉';document.getElementById('islandDetail').innerHTML='厦门旅行圆满完成！';return}var c=TC[e.type]||TC.visit;document.getElementById('islandDot').style.background=c.color;document.getElementById('islandIcon').textContent=c.icon;document.getElementById('islandName').textContent=e.name;document.getElementById('islandCount').textContent=getCountdown(e);var detail='<strong>'+e.time+'</strong> · '+e.name;if(e.loc)detail+='<br>📍 '+e.loc;if(e.desc)detail+='<br>'+e.desc;detail+='<br><span style="color:'+c.color+'">●</span> '+getCountdown(e);document.getElementById('islandDetail').innerHTML=detail;var actions='';if(e.type==='flight'&&e.flightNo)actions+='<button class="island-btn" onclick="event.stopPropagation();openUmetrip()">📲 航旅纵横</button>';if(e.type==='train'&&e.trainNo)actions+='<button class="island-btn" onclick="event.stopPropagation();open12306()">🚄 12306</button>';if(e.lng&&e.lat){actions+='<button class="island-btn" onclick="event.stopPropagation();navigateToHere('+e.lng+','+e.lat+',\''+esc(e.loc)+'\',\'walk\')">🚶 步行</button>';actions+='<button class="island-btn" onclick="event.stopPropagation();navigateToHere('+e.lng+','+e.lat+',\''+esc(e.loc)+'\',\'car\')">🚕 打车</button>'}document.getElementById('islandActions').innerHTML=actions}
function toggleIsland(){islandExpanded=!islandExpanded;document.getElementById('island').classList.toggle('expanded',islandExpanded);if(islandExpanded){clearTimeout(islandTimer);islandTimer=setTimeout(function(){islandExpanded=false;document.getElementById('island').classList.remove('expanded')},8000)}}

// Service Worker Registration (offline support, only when served via http/https)
if('serviceWorker' in navigator && location.protocol.startsWith('http')){
  navigator.serviceWorker.register('./sw.js').then(function(reg){
    console.log('SW已注册，离线可用');
    reg.addEventListener('updatefound',function(){
      var nw=reg.installing;
      if(nw){
        nw.addEventListener('statechange',function(){
          if(nw.state==='activated' && navigator.serviceWorker.controller){
            window.location.reload();
          }
        });
      }
    });
    reg.update();
  }).catch(function(err){
    console.log('SW注册失败:',err);
  });
  navigator.serviceWorker.addEventListener('controllerchange',function(){
    window.location.reload();
  });
}

// Init - 根据当天日期自动切换到对应Tab
function autoSelectDay(){
  var today=new Date();
  var y=today.getFullYear(),m=today.getMonth()+1,d=today.getDate();
  var todayStr=y+'-'+(m<10?'0':'')+m+'-'+(d<10?'0':'')+d;
  var dates={0:'2026-08-04',1:'2026-08-06',2:'2026-08-07',3:'2026-08-08',4:'2026-08-09'};
  var bestDay=0;
  for(var day in dates){
    if(todayStr>=dates[day])bestDay=parseInt(day);
  }
  // 如果已经过了所有行程日期，显示最后一天
  return bestDay;
}
switchDay(autoSelectDay());
